[package]
name = "dubplate-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
audio = { workspace = true, features = ["compressed"] }
collection.workspace = true
engine.workspace = true
image.workspace = true
key-detect.workspace = true
pipeline.workspace = true
rekordbox.workspace = true
report.workspace = true

serde.workspace = true
serde_json.workspace = true
# Reading the archive in the same place the analysis runs, so a track's bytes
# never cross the boundary twice. `deflate` only: a Beatport zip is deflate, and
# the other methods carry C libraries that do not build for wasm.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

wasm-bindgen = "0.2"
# Uint8Array and Object, which is all the JavaScript side of the OPFS handle is:
# the buffer both directions copy through and the { at } every call takes.
js-sys = "0.3"
# Blob and FileReaderSync, so a file the person picked is read where it already
# sits rather than after being copied. Two features rather than the crate:
# web-sys is enormous and compiles only what is named. FileSystemSyncAccessHandle
# is not among them, because web-sys keeps it behind "web_sys_unstable_apis",
# a flag every crate in the build would have to be compiled with; `opfs`
# declares it instead.
web-sys = { version = "0.3", features = ["Blob", "FileReaderSync"] }
serde-wasm-bindgen = "0.6"
# A Rust panic in a tab is otherwise `unreachable executed` and nothing else.
console_error_panic_hook = "0.1"
