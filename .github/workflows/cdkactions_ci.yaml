# Generated by cdkactions. Do not modify
# Generated as part of the 'music-analyze' stack.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    name: Nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: devenv build
        run: devenv build outputs.music-analyze
    timeout-minutes: 45
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: just check
        run: devenv shell -- just check
    timeout-minutes: 30
  workflows-drift:
    name: Workflows drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: Re-synth workflows
        run: devenv shell -- just synth-workflows
      - name: No drift
        run: git diff --exit-code -- .github/workflows/
    timeout-minutes: 15
